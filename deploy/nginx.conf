# Nginx site config for wedding.peculiex.com
#
# Install on the server as:
#   /etc/nginx/sites-available/wedding.peculiex.com
# then symlink into sites-enabled (see DEPLOY.md).
#
# Certbot rewrites this file when it issues the certificate, adding the
# listen 443 block and the redirect. Install this HTTP-only version first.

server {
    listen 80;
    listen [::]:80;
    server_name wedding.peculiex.com;

    # Uploaded/served payloads stay small; keep the ceiling tight.
    client_max_body_size 10M;

    # Gzip text assets. Next.js already compresses its own output, but this
    # covers the API's JSON responses too.
    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 1024;

    # --- API (Node/Express on 4100) ------------------------------------
    # Must come before the catch-all so /api never reaches Next.js.
    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # --- Member-uploaded photos (served by the API from local disk) ----
    location /uploads/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
    }

    # --- Next.js build assets ------------------------------------------
    # Content-hashed, so they can be cached hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Next.js app (3100) --------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
